# Drop this next to CTFd's docker-compose.yml as docker-compose.override.yml to enable Flagprint's
# script delivery (generate.py in a sandbox). Flag, replace and variants delivery don't need it.
#
#   DOCKER_GID=$(getent group docker | cut -d: -f3) docker compose up -d --build
#   docker pull ghcr.io/rj-karan/flagprint-generator:latest
services:
  ctfd:
    group_add:
      - "${DOCKER_GID:?run: DOCKER_GID=$(getent group docker | cut -d: -f3) docker compose up}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
